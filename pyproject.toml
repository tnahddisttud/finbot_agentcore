[project]
name = "finance-agent"
version = "0.1.0"
description = "FinBot — finance research agent with a semantic router (LangChain + LangGraph + Groq)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0.0",
    "langchain-groq>=1.1.0",
    "langchain-community>=0.4.1",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langgraph-checkpoint-aws>=1.0.0",
    "yfinance>=0.2.40",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "bedrock-agentcore>=1.0.0",
    "bedrock-agentcore-starter-toolkit>=0.2.0",
    "langchain-mcp-adapters>=0.3.0",
]

# This project is a set of scripts, not an installable package — don't try to build it.
[tool.uv]
package = false
